repos:
  # Ruff — linting + formatting (replaces black, isort, flake8)
  - repo: local
    hooks:
      - id: ruff-check
        name: Ruff lint (project lock)
        entry: uv run --frozen --no-sync ruff check --force-exclude --fix --exit-non-zero-on-fix
        language: system
        types_or: [python, pyi, jupyter]
      - id: ruff-format
        name: Ruff format (project lock)
        entry: uv run --frozen --no-sync ruff format --force-exclude
        language: system
        types_or: [python, pyi, jupyter]

  # General file hygiene
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
        args: [--unsafe]    # needed for docker-compose anchors
      - id: check-toml
      - id: check-added-large-files
        args: [--maxkb=1000]
      - id: check-merge-conflict
      - id: debug-statements

  # Dockerfile linting
  - repo: https://github.com/hadolint/hadolint
    rev: v2.12.0
    hooks:
      - id: hadolint-docker
